<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">One request across NexaPilot</title><desc id="desc">A sequence diagram showing request persistence, bounded context assembly, provider streaming, governed tool execution, history reload, and atomic run completion.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f0ff"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker><style>.bg{fill:url(#bg)}.head{fill:#fff;stroke:#d6e0ef;stroke-width:1.4;filter:url(#shadow)}.active{fill:url(#accent);stroke:none}.life{stroke:#a8b5c8;stroke-width:1.5;stroke-dasharray:5 6}.msg{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.phase{fill:#fff;stroke:#dbe4f0}.phase-accent{fill:#ede9fe}text{font-family:Inter,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:600}.sub{font-size:12px;fill:#64748b}.actor{font-size:13px;font-weight:600}.white{fill:#fff}.label{font-size:12px;font-weight:500}.phase-label{font-size:11px;font-weight:600;letter-spacing:.8px;fill:#6d28d9}@media(prefers-color-scheme:dark){.bg{fill:#08111f}.head,.phase{fill:#111c2d;stroke:#2b3c55}.phase-accent{fill:#211b3c}.life{stroke:#50627a}.msg{stroke:#8495ad}text{fill:#e6edf7}.sub{fill:#9db0c8}}</style></defs>
  <rect class="bg" width="1400" height="850" rx="22"/><text class="title" x="52" y="52">One request across the system</text><text class="sub" x="52" y="76">Durability first: state is committed before execution and after every external effect.</text>
  <g transform="translate(0 104)"><rect class="head" x="42" width="142" height="58" rx="13"/><text class="actor" x="113" y="27" text-anchor="middle">Console / CLI</text><text class="sub" x="113" y="44" text-anchor="middle">interface</text><rect class="head" x="214" width="142" height="58" rx="13"/><text class="actor" x="285" y="35" text-anchor="middle">FastAPI</text><rect class="active" x="386" width="142" height="58" rx="13" filter="url(#shadow)"/><text class="actor white" x="457" y="27" text-anchor="middle">SessionLoop</text><text class="sub white" x="457" y="44" text-anchor="middle" opacity=".8">orchestrator</text><rect class="head" x="558" width="142" height="58" rx="13"/><text class="actor" x="629" y="27" text-anchor="middle">Context</text><text class="sub" x="629" y="44" text-anchor="middle">bounded input</text><rect class="head" x="730" width="142" height="58" rx="13"/><text class="actor" x="801" y="27" text-anchor="middle">Provider</text><text class="sub" x="801" y="44" text-anchor="middle">gateway</text><rect class="head" x="902" width="142" height="58" rx="13"/><text class="actor" x="973" y="27" text-anchor="middle">Tool runtime</text><text class="sub" x="973" y="44" text-anchor="middle">policy + execute</text><rect class="head" x="1074" width="142" height="58" rx="13"/><text class="actor" x="1145" y="35" text-anchor="middle">SQLite</text></g>
  <g><line class="life" x1="113" y1="162" x2="113" y2="808"/><line class="life" x1="285" y1="162" x2="285" y2="808"/><line class="life" x1="457" y1="162" x2="457" y2="808"/><line class="life" x1="629" y1="162" x2="629" y2="808"/><line class="life" x1="801" y1="162" x2="801" y2="808"/><line class="life" x1="973" y1="162" x2="973" y2="808"/><line class="life" x1="1145" y1="162" x2="1145" y2="808"/></g>
  <rect class="phase" x="42" y="188" width="1174" height="142" rx="14"/><text class="phase-label" x="60" y="211">1 · ACCEPT &amp; COMMIT</text>
  <line class="msg" x1="113" y1="240" x2="277" y2="240"/><text class="label" x="195" y="230" text-anchor="middle">message + run request</text><line class="msg" x1="285" y1="280" x2="1137" y2="280"/><text class="label" x="715" y="270" text-anchor="middle">persist message and Run</text><line class="msg" x1="285" y1="316" x2="449" y2="316"/><text class="label" x="367" y="306" text-anchor="middle">execute committed Run</text>
  <rect class="phase-accent" x="42" y="344" width="1174" height="204" rx="14"/><text class="phase-label" x="60" y="369">2 · BUILD CONTEXT &amp; STREAM</text>
  <line class="msg" x1="457" y1="400" x2="621" y2="400"/><text class="label" x="539" y="390" text-anchor="middle">build bounded input</text><line class="msg" x1="629" y1="440" x2="1137" y2="440"/><text class="label" x="883" y="430" text-anchor="middle">load history + memory</text><line class="return" x1="1145" y1="474" x2="637" y2="474"/><text class="label" x="891" y="464" text-anchor="middle">persisted context</text><line class="msg" x1="457" y1="514" x2="793" y2="514"/><text class="label" x="625" y="504" text-anchor="middle">stream normalized request</text>
  <rect class="phase" x="42" y="562" width="1174" height="154" rx="14"/><text class="phase-label" x="60" y="587">3 · GOVERN TOOL EFFECTS</text><line class="return" x1="801" y1="620" x2="465" y2="620"/><text class="label" x="633" y="610" text-anchor="middle">parts + tool calls</text><line class="msg" x1="457" y1="658" x2="965" y2="658"/><text class="label" x="711" y="648" text-anchor="middle">policy · approval · execute</text><line class="msg" x1="973" y1="696" x2="1137" y2="696"/><text class="label" x="1055" y="686" text-anchor="middle">persist operation + result</text>
  <rect class="phase-accent" x="42" y="730" width="1174" height="82" rx="14"/><text class="phase-label" x="60" y="755">4 · RELOAD &amp; COMPLETE</text><line class="msg" x1="457" y1="782" x2="1137" y2="782"/><text class="label" x="797" y="772" text-anchor="middle">terminal Run + outbox event</text>
  <path class="return" d="M973 716V740H629V716"/><text class="label" x="801" y="735" text-anchor="middle">reload persisted history</text>
</svg>
