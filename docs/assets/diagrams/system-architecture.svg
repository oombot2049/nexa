<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NexaPilot system architecture</title><desc id="desc">Five architectural layers connect user interfaces through application services and runtime capabilities to durable domain state and infrastructure adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f0ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <style>.bg{fill:url(#bg)}.layer{fill:#fff;stroke:#d9e2f1;stroke-width:1.5;filter:url(#shadow)}.cap{fill:url(#accent)}.chip{fill:#f1f5f9}.edge{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}text{font-family:Inter,"Segoe UI",sans-serif;fill:#0f172a}.h{font-size:25px;font-weight:600}.layer-title{font-size:12px;font-weight:600;letter-spacing:1px;fill:#64748b}.chip-text{font-size:14px;font-weight:500}.note{font-size:12px;fill:#64748b}.white{fill:#fff}@media(prefers-color-scheme:dark){.bg{fill:#08111f}.layer{fill:#111c2d;stroke:#2b3c55}.chip{fill:#1b293e}text{fill:#e6edf7}.layer-title,.note{fill:#9db0c8}.edge{stroke:#7f91aa}}</style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="22"/><text class="h" x="60" y="54">NexaPilot modular monolith</text><text class="note" x="60" y="78">Explicit ports preserve replaceable adapters without distributed-system overhead.</text>
  <rect class="layer" x="64" y="108" width="1072" height="92" rx="18"/><rect class="cap" x="64" y="108" width="12" height="92" rx="6"/><text class="layer-title" x="98" y="136">INTERFACES</text>
  <g><rect class="chip" x="98" y="151" width="160" height="32" rx="9"/><text class="chip-text" x="178" y="172" text-anchor="middle">Web console</text><rect class="chip" x="276" y="151" width="116" height="32" rx="9"/><text class="chip-text" x="334" y="172" text-anchor="middle">CLI</text><rect class="chip" x="410" y="151" width="136" height="32" rx="9"/><text class="chip-text" x="478" y="172" text-anchor="middle">REST API</text><rect class="chip" x="564" y="151" width="168" height="32" rx="9"/><text class="chip-text" x="648" y="172" text-anchor="middle">Feishu channel</text><rect class="chip" x="750" y="151" width="176" height="32" rx="9"/><text class="chip-text" x="838" y="172" text-anchor="middle">Cron wake-up</text></g>
  <line class="edge" x1="600" y1="200" x2="600" y2="230"/>
  <rect class="layer" x="120" y="232" width="960" height="92" rx="18"/><text class="layer-title" x="150" y="260">APPLICATION SERVICES</text><g><rect class="chip" x="150" y="275" width="210" height="32" rx="9"/><text class="chip-text" x="255" y="296" text-anchor="middle">Session / Run services</text><rect class="chip" x="378" y="275" width="176" height="32" rx="9"/><text class="chip-text" x="466" y="296" text-anchor="middle">AgentService</text><rect class="chip" x="572" y="275" width="198" height="32" rx="9"/><text class="chip-text" x="671" y="296" text-anchor="middle">PermissionService</text></g>
  <line class="edge" x1="600" y1="324" x2="600" y2="354"/>
  <rect class="layer" x="94" y="356" width="1012" height="104" rx="18"/><text class="layer-title" x="124" y="384">AGENT RUNTIME</text><g><rect class="cap" x="124" y="402" width="176" height="38" rx="10"/><text class="chip-text white" x="212" y="426" text-anchor="middle">SessionLoop</text><rect class="chip" x="318" y="402" width="190" height="38" rx="10"/><text class="chip-text" x="413" y="426" text-anchor="middle">Context Manager</text><rect class="chip" x="526" y="402" width="190" height="38" rx="10"/><text class="chip-text" x="621" y="426" text-anchor="middle">Provider Gateway</text><rect class="chip" x="734" y="402" width="190" height="38" rx="10"/><text class="chip-text" x="829" y="426" text-anchor="middle">Tool Registry</text></g>
  <line class="edge" x1="600" y1="460" x2="600" y2="490"/>
  <rect class="layer" x="120" y="492" width="960" height="92" rx="18"/><text class="layer-title" x="150" y="520">DURABLE DOMAIN &amp; PROJECTIONS</text><text class="chip-text" x="150" y="553">Projects · Sessions · Runs · Messages · Memory · Tasks · Artifacts</text><text class="note" x="926" y="553" text-anchor="end">source-linked and rebuildable</text>
  <line class="edge" x1="600" y1="584" x2="600" y2="614"/>
  <rect class="layer" x="64" y="616" width="1072" height="72" rx="18"/><text class="layer-title" x="98" y="644">INFRASTRUCTURE PORTS</text><text class="chip-text" x="98" y="671">SQLite · Transactional Outbox · Event Bus · MCP · Optional adapters</text><rect class="cap" x="1010" y="635" width="92" height="34" rx="17"/><text class="chip-text white" x="1056" y="657" text-anchor="middle">local-first</text>
</svg>
