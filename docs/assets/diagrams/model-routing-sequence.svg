<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Model routing and fallback sequence</title><desc id="desc">The Agent Loop asks the router for compatible plans. The gateway records a call, streams through an adapter, and either succeeds, safely falls back before output, or stops after partial semantic output.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity=".13"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker><style>.bg{fill:url(#bg)}.head{fill:#fff;stroke:#d5dfed;stroke-width:1.5;filter:url(#shadow)}.active{fill:url(#accent)}.life{stroke:#a8b5c8;stroke-width:1.5;stroke-dasharray:5 6}.msg{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.safe{fill:#ecfdf5;stroke:#86efac}.stop{fill:#fff1f2;stroke:#fda4af}.success{fill:#eff6ff;stroke:#93c5fd}text{font-family:Inter,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:600}.sub{font-size:12px;fill:#64748b}.actor{font-size:13px;font-weight:600}.white{fill:#fff}.label{font-size:12px;font-weight:500}.case{font-size:12px;font-weight:600;letter-spacing:.7px}@media(prefers-color-scheme:dark){.bg{fill:#08111f}.head{fill:#111c2d;stroke:#2b3c55}.life{stroke:#50627a}.msg{stroke:#8495ad}.safe{fill:#0d2a22;stroke:#28765b}.stop{fill:#32161d;stroke:#8e4354}.success{fill:#122843;stroke:#35699e}text{fill:#e6edf7}.sub{fill:#9db0c8}}</style></defs>
  <rect class="bg" width="1400" height="820" rx="22"/><text class="title" x="52" y="52">Model routing and fallback</text><text class="sub" x="52" y="76">The semantic-output barrier separates safe recovery from visible interruption.</text>
  <g transform="translate(0 106)"><rect class="head" x="54" width="156" height="58" rx="13"/><text class="actor" x="132" y="35" text-anchor="middle">Agent Loop</text><rect class="head" x="250" width="156" height="58" rx="13"/><text class="actor" x="328" y="27" text-anchor="middle">Model Router</text><text class="sub" x="328" y="44" text-anchor="middle">capability filter</text><rect class="active" x="446" width="156" height="58" rx="13" filter="url(#shadow)"/><text class="actor white" x="524" y="27" text-anchor="middle">Gateway</text><text class="sub white" x="524" y="44" text-anchor="middle" opacity=".8">retry + fallback</text><rect class="head" x="642" width="156" height="58" rx="13"/><text class="actor" x="720" y="27" text-anchor="middle">Adapter</text><text class="sub" x="720" y="44" text-anchor="middle">transport</text><rect class="head" x="838" width="156" height="58" rx="13"/><text class="actor" x="916" y="27" text-anchor="middle">SQLite</text><text class="sub" x="916" y="44" text-anchor="middle">ledger</text><rect class="head" x="1034" width="156" height="58" rx="13"/><text class="actor" x="1112" y="27" text-anchor="middle">Event Bus</text><text class="sub" x="1112" y="44" text-anchor="middle">observability</text></g>
  <g><line class="life" x1="132" y1="164" x2="132" y2="790"/><line class="life" x1="328" y1="164" x2="328" y2="790"/><line class="life" x1="524" y1="164" x2="524" y2="790"/><line class="life" x1="720" y1="164" x2="720" y2="790"/><line class="life" x1="916" y1="164" x2="916" y2="790"/><line class="life" x1="1112" y1="164" x2="1112" y2="790"/></g>
  <line class="msg" x1="132" y1="210" x2="320" y2="210"/><text class="label" x="226" y="200" text-anchor="middle">history + tools + options</text><path class="msg" d="M328 240h100v34H336"/><text class="label" x="382" y="232" text-anchor="middle">resolve + filter</text><line class="return" x1="328" y1="300" x2="516" y2="300"/><text class="label" x="422" y="290" text-anchor="middle">ordered plans</text><line class="msg" x1="524" y1="338" x2="1104" y2="338"/><text class="label" x="814" y="328" text-anchor="middle">llm.route.planned</text><line class="msg" x1="524" y1="374" x2="908" y2="374"/><text class="label" x="716" y="364" text-anchor="middle">create llm_call</text><line class="msg" x1="524" y1="410" x2="712" y2="410"/><text class="label" x="618" y="400" text-anchor="middle">stream selected plan</text>
  <rect class="safe" x="46" y="452" width="1160" height="116" rx="14"/><text class="case" x="66" y="478" fill="#15803d">SAFE FALLBACK · FAILURE BEFORE SEMANTIC OUTPUT</text><line class="msg" x1="524" y1="510" x2="908" y2="510"/><text class="label" x="716" y="500" text-anchor="middle">finish failed call + link next call</text><line class="msg" x1="524" y1="548" x2="712" y2="548"/><text class="label" x="618" y="538" text-anchor="middle">stream next compatible plan</text><line class="msg" x1="524" y1="490" x2="1104" y2="490"/><text class="label" x="814" y="480" text-anchor="middle">llm.fallback.selected</text>
  <rect class="stop" x="46" y="584" width="1160" height="90" rx="14"/><text class="case" x="66" y="610" fill="#be123c">STOP · SEMANTIC OUTPUT ALREADY EMITTED</text><line class="msg" x1="524" y1="640" x2="908" y2="640"/><text class="label" x="716" y="630" text-anchor="middle">mark interrupted + preserve partial output</text><line class="return" x1="524" y1="658" x2="140" y2="658"/><text class="label" x="332" y="648" text-anchor="middle">ProviderCallFailed(partial_output)</text>
  <rect class="success" x="46" y="690" width="1160" height="94" rx="14"/><text class="case" x="66" y="716" fill="#1d4ed8">SUCCESS · NORMALIZED COMPLETION</text><line class="msg" x1="524" y1="746" x2="908" y2="746"/><text class="label" x="716" y="736" text-anchor="middle">usage + estimated cost</text><line class="msg" x1="524" y1="768" x2="1104" y2="768"/><line class="return" x1="524" y1="782" x2="140" y2="782"/>
</svg>
